# 색상은 src/ui/theme.py · assets/styles.css 와 같은 값을 쓴다.
#
# ⚠ Streamlit 내부 구현을 겨냥한 CSS 보다 여기를 먼저 쓴다.
# `.st-emotion-cache-*` 는 빌드마다 바뀌고, `[data-baseweb="tab"]` 은 1.60 에서
# 탭이 baseweb → react-aria 로 바뀌며 **아무것도 매치하지 않게 됐다.** 규칙은
# styles.css 에 남아 있었지만 화면에는 적용된 적이 없었다(실측: 탭 font-weight
# 400, 표 헤더 배경 미적용). 아래 옵션들은 버전 간 계약이라 그렇게 조용히 죽지
# 않는다.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"
font = "sans serif"

# 위젯 테두리·모서리를 커스텀 카드(--kl-radius 12px, --kl-grid)와 맞춘다.
# 나란히 놓인 카드와 입력 위젯의 모서리가 다르면 한 화면에서 두 디자인이
# 섞인 것처럼 보인다.
borderColor = "#e1e0d9"
baseRadius = "0.75rem"

# 표 헤더를 후퇴시켜 데이터가 앞으로 나오게 한다.
# 원래 styles.css 의 `[data-testid="stDataFrame"] thead tr th` 가 하려던 일인데,
# st.dataframe 은 HTML 표가 아니라 캔버스 기반 그리드라 `thead` 가 존재하지
# 않는다 — 그 규칙은 매치 0 이었다. 이 옵션이 지원되는 유일한 경로다.
dataframeHeaderBackgroundColor = "#f9f9f7"
dataframeBorderColor = "#e1e0d9" 

# 링크는 본문 대비 4.5:1 이 나오는 --kl-on-blue 를 쓴다 (기본 파랑은 미달).
linkColor = "#2469bc"

# ── 사이드바: 딥 네이비 ─────────────────────────────────────────────
# 헤더·hero 를 네이비로 눕히고 사이드바만 밝게 두면 둘이 따로 논다.
# 조작부(사이드바)를 어둡게 · 내용부(본문)를 밝게 두면 필터를 만지는 곳과
# 결과를 읽는 곳이 눈으로 구분된다.
#
# ⚠ primaryColor 를 골드로 두는 건 취향이 아니라 명암비 때문이다.
#   Streamlit 은 이 색을 멀티셀렉트 태그 배경으로 쓰는데(사이드바에 태그가
#   10개 넘게 뜬다) 기존 #2a78d6 위의 흰 글자는 4.42:1 로 AA 미달이었다.
#   골드 #cba95c 는 어두운 글자와 7.81:1 이라 통과하고 톤도 맞는다.
[theme.sidebar]
backgroundColor = "#0d1a2b"
secondaryBackgroundColor = "#1c3450"
textColor = "#f4f6f9"
primaryColor = "#cba95c"
borderColor = "#27466a"

[client]
# 우상단 툴바에서 **개발자 옵션**(Deploy · Rerun · Clear cache)을 감춘다.
# 심사·발표 화면에 배포 버튼이 떠 있으면 완성된 제품이 아니라 작업 중인
# 콘솔처럼 보인다. "minimal" 이 아니라 "viewer" 인 이유는 인쇄·스크린샷 같은
# **열람자 옵션은 남겨야** 심사위원이 화면을 갈무리할 수 있기 때문이다.
toolbarMode = "viewer"

[server]
headless = true

[browser]
gatherUsageStats = false
